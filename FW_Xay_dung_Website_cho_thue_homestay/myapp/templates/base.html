{% load static %}
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MyHome GIS{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm" style="z-index: 2000;">
      <a class="navbar-brand font-weight-bold" href="{% url 'home' %}">
        <i class="fas fa-building text-primary"></i> MyHome GIS
      </a>
      <div class="ml-auto">
        <a class="nav-link d-inline-block" href="{% url 'home' %}">Trang chủ</a>
      </div>
    </nav>

    <div class="container mt-3">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
          </div>
        {% endfor %}
      {% endif %}
    </div>

    {% block content_wrapper %}
      <div class="container mt-4">
        {% block content %}{% endblock %}
      </div>
    {% endblock %}

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
