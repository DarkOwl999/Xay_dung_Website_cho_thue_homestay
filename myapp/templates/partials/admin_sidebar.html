{% with current=request.resolver_match.url_name %}
<div class="admin-brand">
    <div class="admin-brand-icon">
        <i class="fas fa-layer-group"></i>
    </div>
    <div>
        <div class="admin-eyebrow">CanHo24h</div>
        <h2 class="admin-brand-title">Stage 01 Admin</h2>
    </div>
</div>

<p class="admin-sidebar-copy">
    Giai đoạn đầu chỉ tập trung vào dashboard tổng quan và quản lý căn hộ cơ bản để làm nền cho web và bản đồ.
</p>

<nav class="admin-nav">
    <a href="{% url 'custom_admin' %}" class="admin-nav-link {% if current == 'custom_admin' %}is-active{% endif %}">
        <span><i class="fas fa-chart-pie"></i> Dashboard</span>
        <small>Tổng quan</small>
    </a>
    <a href="{% url 'apartment_admin' %}" class="admin-nav-link {% if current == 'apartment_admin' or current == 'apartment_create' or current == 'apartment_update' %}is-active{% endif %}">
        <span><i class="fas fa-building"></i> Căn hộ</span>
        <small>CRUD cơ bản</small>
    </a>
</nav>

<div class="admin-sidebar-card">
    <div class="admin-sidebar-card-title">Truy cập nhanh</div>
    <a href="{% url 'home' %}" class="admin-sidebar-card-link">
        <i class="fas fa-home"></i> Về trang chủ
    </a>
    <a href="{% url 'map_view' %}" class="admin-sidebar-card-link">
        <i class="fas fa-map-marked-alt"></i> Mở bản đồ GIS
    </a>
</div>
{% endwith %}
