<div class="mb-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
        <div>
            <h2 class="mb-1">Quản trị dữ liệu website</h2>
            <p class="text-muted mb-0">Quản lý căn hộ, phòng và đơn đặt phòng ngay trên giao diện web.</p>
        </div>
        <a href="{% url 'custom_admin' %}" class="btn btn-outline-primary mt-2 mt-md-0">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
    </div>

    <div class="btn-group flex-wrap" role="group">
        <a href="{% url 'apartment_admin' %}" class="btn btn-{% if request.resolver_match.url_name == 'apartment_admin' or request.resolver_match.url_name == 'apartment_create' or request.resolver_match.url_name == 'apartment_update' %}primary{% else %}outline-primary{% endif %}">
            <i class="fas fa-building"></i> Căn hộ
        </a>
        <a href="{% url 'room_admin' %}" class="btn btn-{% if request.resolver_match.url_name == 'room_admin' or request.resolver_match.url_name == 'room_create' or request.resolver_match.url_name == 'room_update' %}primary{% else %}outline-primary{% endif %}">
            <i class="fas fa-door-open"></i> Phòng
        </a>
        <a href="{% url 'booking_admin' %}" class="btn btn-{% if request.resolver_match.url_name == 'booking_admin' or request.resolver_match.url_name == 'booking_update' %}primary{% else %}outline-primary{% endif %}">
            <i class="fas fa-calendar-check"></i> Đơn đặt phòng
        </a>
    </div>
</div>
